[versions]
loom = "1.17-SNAPSHOT"
kotlin = "2.4.10"
fletchingTable = "0.1.0-alpha.22"
ksp = "2.3.11"

devauth = "1.2.1"

fabric-loader = "0.19.3"
fabric-language-kotlin = "1.13.13+kotlin.2.4.10"

skyblock-api = "4.2.24"

kbus = "2026.09.3"
kommand = "2026.09.2"
klassgraph = "2026.10.1"
snowbird = "2026.09.4"
cascade = "2026.09.7"
parallax = "2026.10.1"
updater = "2026.09.2"
athen = "0.3.5b"

hypixel-modapi = "1.0.2"
hypixel-modapi-fabric = "1.0.2+build.1+mc26.1"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }

devauth = { module = "me.djtheredstoner:DevAuth-fabric", version.ref = "devauth" }

skyblock-api = { module = "tech.thatgravyboat:skyblock-api", version.ref = "skyblock-api" }

kbus = { module = "foo.starred:kbus", version.ref = "kbus" }
kommand = { module = "foo.starred:kommand", version.ref = "kommand" }
klassgraph = { module = "foo.starred:klassgraph", version.ref = "klassgraph" }
snowbird = { module = "foo.starred:snowbird", version.ref = "snowbird" }
cascade = { module = "foo.starred:cascade", version.ref = "cascade" }
parallax = { module = "foo.starred:parallax", version.ref = "parallax" }
updater = { module = "foo.starred:updater", version.ref = "updater" }
athen = { module = "foo.starred:athen", version.ref = "athen" }

hypixel-modapi = { module = "net.hypixel:mod-api", version.ref = "hypixel-modapi" }
hypixel-modapi-fabric = { module = "maven.modrinth:hypixel-mod-api", version.ref = "hypixel-modapi-fabric" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
fletchingTable = { id = "dev.kikugie.fletching-table.fabric", version.ref = "fletchingTable" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }